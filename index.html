<head>

<title>Stick Duel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1b0f2e; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; }
  #bars { top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
  .side { font-size: 14px; font-weight: 800; }
  .side.r { text-align: right; }
  .hp { height: 16px; margin-top: 4px; border-radius: 8px; background: #0008; border: 2px solid #ffffff55; overflow: hidden; display: flex; }
  .side.r .hp { justify-content: flex-end; }
  .hp b { display: block; height: 100%; background: var(--c); transition: width .15s; }
  .pips { margin-top: 4px; letter-spacing: 3px; font-size: 13px; color: #ffd166; }
  .me .nm { color: #ffd166; }
  #clock { font: 900 30px/1 system-ui, sans-serif; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  #clock small { display: block; font-size: 11px; font-weight: 700; opacity: .75; letter-spacing: .05em; }
  #msg { top: 28%; left: 0; right: 0; text-align: center; font: italic 900 64px/1 system-ui, sans-serif; color: #ffd166; -webkit-text-stroke: 3px #5a1200; letter-spacing: .03em; }
  #msg small { display: block; margin-top: 10px; font: 700 17px system-ui, sans-serif; color: #fff; -webkit-text-stroke: 0; }
  #combo { top: 44%; left: 0; right: 0; text-align: center; font: italic 900 34px/1 system-ui, sans-serif; color: #ff5d73; -webkit-text-stroke: 2px #fff; opacity: 0; transition: opacity .2s; }
  #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); left: 0; right: 0; padding: 0 16px; text-align: center; font-size: 14px; }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .75; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #1b0f2ea8; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { width: min(360px, 90vw); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #2d1b47; border: 1px solid #ffffff2e; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 28px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #ff9fd1; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffd166; font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffd166; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 18px); touch-action: none; }
  .pad button { position: absolute; width: 54px; height: 54px; border-radius: 14px; border: 2px solid #ffffff77; background: #00000040; color: #fff; font: 800 13px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #dpad { left: max(12px, env(safe-area-inset-left)); width: 168px; height: 116px; }
  #dpad [data-k=left] { left: 0; top: 62px; } #dpad [data-k=right] { left: 114px; top: 62px; } #dpad [data-k=up] { left: 57px; top: 0; }
  #acts { right: max(12px, env(safe-area-inset-right)); width: 168px; height: 126px; }
  #acts button { width: 62px; height: 62px; border-radius: 50%; }
  #acts [data-k=punch] { left: 0; top: 64px; background: #ffd16655; } #acts [data-k=kick] { left: 53px; top: 0; background: #ff5d7355; } #acts [data-k=block] { left: 106px; top: 64px; background: #4cc9f055; }
  @media (pointer: coarse) { #hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 160px); } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="bars"><div class="side l" id="sideL"></div><div id="clock"></div><div class="side r" id="sideR"></div></div>
<div class="hud" id="msg"></div>
<div class="hud" id="combo">COMBO!</div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="dpad" hidden><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="acts" hidden><button data-k="punch">PUNCH</button><button data-k="kick">KICK</button><button data-k="block">BLOCK</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>Rounds</h3><ol id="results"></ol>
  <h3>Most match wins</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ STICK DUEL · a Multiplayer Agent starter ═════════════════════════════════════════
 * 1v1 stick fighters: punch, kick, block, and punch-punch-kick for a combo. Best of 5 rounds.
 * Versus, 2 players; a bot takes the empty side. Anyone else watches and the winner stays on.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ health, round length, moves (damage, reach, timing), bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   FIGHTERS ...... walking, jumping, blocking, attacks, getting hit (the same code for people and bots)
 *   MATCH (HOST) .. seats, rounds, the timer, KOs, the winner, the bot. Only the host writes these.
 *   ME ............ my controls and my hits. I write only my own fighter.
 *   DRAW .......... camera, the rooftop dojo, stick figures (poses), hit sparks
 *   HUD & RESULTS . health bars, round pips, timer, banners, results, leaderboard
 *   INPUT ......... keyboard, and a d-pad with Punch, Kick and Block on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each fighter writes its OWN entity: `p` (one packed JSON field: round, position, speed,
 *     facing, health, state, the attack it is doing) about 15 times a second, `hb` (heartbeat)
 *     once a second, `n`/`c` (name, color) once. Your health is yours.
 *   - Hits: the ATTACKER sees its punch or kick touch the other fighter and sends "hit" {to, by,
 *     k, d, dir, r}: which move, the damage, the direction. Only the one hit applies it, on its
 *     own screen: if it was blocking (and facing the hit) it takes a little; otherwise it takes it
 *     all and staggers, or goes down from a combo. Everyone else just shows the spark.
 *     (The host does all this for the bot.)
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` {id, v, phase:
 *     intro|fight|ko|over, round, seats, names, wins, startAt, endsAt, rw, why, winner} and
 *     `bots`. It reads both fighters' health (only from this round: `p.r`), calls the KO or the
 *     time-out, counts round wins and starts the next round by bumping match.round.
 *   - The first two people take the seats; a bot takes an empty one. A seated player gone for
 *     6s hands the fighter to the bot; someone waiting takes the bot's seat between rounds.
 *     After a match the winner stays on and the next person waiting steps in.
 *   - "again" (intent): someone pressed Play again on the results card.
 *   - ?attract plays offline, bot against bot (the preview video is recorded from it).
 *   - Leaderboard "duel-wins": +1 for every match you win, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  hp: 100,              // health per round
  winRounds: 3,         // round wins to take the match (best of 5)
  roundMs: 45000,       // round length; when time is up, more health wins the round
  introMs: 2200,        // "ROUND 2 ... FIGHT!"
  koMs: 2800,           // the K.O. moment before the next round
  resultsMs: 9000,      // the results card before the next match
  walk: 240,            // px/s
  jump: 820,            // px/s up
  gravity: 2300,        // px/s²
  blockTakes: 0.15,     // share of the damage you still take while blocking
  comboWindow: 0.7,     // seconds after a punch lands to keep the combo going
  seatGraceMs: 6000,    // a fighter silent this long hands the seat to the bot
  botReact: 0.28,       // seconds the bot takes to notice an attack ...
  botBlock: 0.5,        // ... and the chance it blocks it
  botAggro: 0.55,       // chance the bot attacks when it is in range
  board: "duel-wins",   // leaderboard name
};
// Moves: time = whole move (s), a0..a1 = when it can hit, reach/height = where (px from the
// fighter's feet), d = damage, kb = knockback px/s, stun = seconds the one hit staggers, lunge = step in.
const MOVES = {
  punch: { time: 0.3, a0: 0.07, a1: 0.15, reach: 64, height: 78, d: 6, kb: 140, stun: 0.3, lunge: 70 },
  kick: { time: 0.5, a0: 0.17, a1: 0.28, reach: 84, height: 50, d: 11, kb: 280, stun: 0.42, lunge: 110 },
  combo: { time: 0.62, a0: 0.18, a1: 0.32, reach: 92, height: 62, d: 18, kb: 560, stun: 1.0, lunge: 260, down: true }, // punch, punch, kick
};
const ARENA = { left: 70, right: 930, startL: 340, startR: 660 }; // world px; the floor is y = 0, up is negative
const BOT_NAMES = ["Kato", "Mantis", "Rocky", "Viper", "Raven"];
const COLORS = ["#ff5d73", "#4cc9f0", "#ffd166", "#06d6a0", "#c77dff", "#ff9f1c"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'stick-duel',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── FIGHTERS ────────────────────────────────────────────────────────────────────────
// States: idle, walk, jump, block, atk (a move is playing), hurt (staggered), down (knocked
// down by a combo), ko (out of health), win (the round is theirs).
function newFighter(id, side) {
  return { id, x: side ? ARENA.startR : ARENA.startL, y: 0, vx: 0, vy: 0, face: side ? -1 : 1, hp: CONFIG.hp, st: "idle", stT: 0, stun: 0,
    k: "punch", ai: 0, at: 0, hit: false, chain: 0, chainUntil: 0, inv: 0, ground: true, r: "", walkT: 0 };
}
const busy = (f) => f.st === "atk" || f.st === "hurt" || f.st === "down" || f.st === "ko" || f.st === "win";
/** One step. ctl = { x: -1..1, jump, punch, kick, block } (punch/kick = pressed just now). */
function stepFighter(f, ctl, dt, foe, now) {
  f.stT += dt; f.inv = Math.max(0, f.inv - dt);
  if ((f.st === "hurt" || f.st === "down") && f.stT >= f.stun) { if (f.st === "down") f.inv = 0.5; setSt(f, "idle"); }
  if (f.st === "atk") { f.at += dt; if (f.at >= MOVES[f.k].time) setSt(f, f.ground ? "idle" : "jump"); }
  if (!busy(f)) {
    if (foe && foe.st !== "ko") f.face = foe.x >= f.x ? 1 : -1;
    if (ctl.block && f.ground) { if (f.st !== "block") setSt(f, "block"); f.vx *= Math.pow(0.001, dt); }
    else {
      const want = (ctl.x || 0) * CONFIG.walk;
      f.vx = f.ground ? want : f.vx + (want - f.vx) * Math.min(1, dt * 4);
      if (ctl.jump && f.ground) { f.vy = -CONFIG.jump; f.ground = false; }
      const st = !f.ground ? "jump" : ctl.x ? "walk" : "idle";
      if (st !== f.st) setSt(f, st);
      if (ctl.punch || ctl.kick) startMove(f, ctl.kick ? (f.chain >= 2 && now < f.chainUntil ? "combo" : "kick") : "punch");
    }
  } else if (f.ground) f.vx *= Math.pow(f.st === "atk" ? 0.004 : 0.03, dt); // moves and staggers slide to a stop
  if (f.st === "walk") f.walkT += dt * Math.abs(f.vx) / 40;
  f.vy += CONFIG.gravity * dt; f.x += f.vx * dt; f.y += f.vy * dt;
  if (f.y >= 0) { f.y = 0; f.vy = 0; if (!f.ground) { f.ground = true; if (f.st === "jump") setSt(f, "idle"); } }
  f.x = Math.max(ARENA.left, Math.min(ARENA.right, f.x));
  if (foe && f.ground && foe.y > -40 && Math.abs(foe.x - f.x) < 38 && f.st !== "ko" && foe.st !== "ko") f.x = foe.x - (foe.x >= f.x ? 1 : -1) * 38; // no walking through each other
  if (now > f.chainUntil) f.chain = 0;
}
function setSt(f, st) { f.st = st; f.stT = 0; }
function startMove(f, k) {
  setSt(f, "atk"); f.k = k; f.at = 0; f.ai = (f.ai + 1) % 1000; f.hit = false; f.vx = f.face * MOVES[k].lunge;
  if (k !== "punch") f.chain = 0;
}
/** Is f's move touching `foe` right now? Returns the hit (once per move), or null. */
function swing(f, foe, roundKey) {
  if (f.st !== "atk" || f.hit || !foe) return null;
  const mv = MOVES[f.k];
  if (f.at < mv.a0 || f.at > mv.a1 || foe.st === "ko" || foe.st === "down" || foe.inv > 0) return null;
  const near = f.x + f.face * 18, far = f.x + f.face * mv.reach, hy = f.y - mv.height; // the move covers near..far at height hy
  if (foe.x + 16 < Math.min(near, far) || foe.x - 16 > Math.max(near, far) || hy < foe.y - 110 || hy > foe.y + 4) return null;
  const hx = foe.x - f.face * 12;
  f.hit = true;
  if (f.k === "punch") { f.chain += 1; f.chainUntil = performance.now() + CONFIG.comboWindow * 1000; }
  return { to: foe.id, by: f.id, k: f.k, d: mv.d, dir: f.face, r: roundKey, x: Math.round(hx), y: Math.round(hy) };
}
/** I (or, on the host, the bot) got hit: block it, or take it. */
function applyHit(f, hit) {
  if (f.st === "ko" || f.st === "down" || f.inv > 0 || f.st === "win") return;
  const mv = MOVES[hit.k] || MOVES.punch, blocked = f.st === "block" && f.face === -hit.dir;
  if (blocked) { f.hp -= Math.round(mv.d * CONFIG.blockTakes); f.vx = hit.dir * mv.kb * 0.45; }
  else {
    f.hp -= mv.d; f.vx = hit.dir * mv.kb; f.chain = 0;
    if (mv.down) { setSt(f, "down"); f.vy = -380; f.ground = false; } else setSt(f, "hurt");
    f.stun = mv.stun;
  }
  if (f.hp <= 0) { f.hp = 0; setSt(f, "ko"); f.vx = hit.dir * 420; f.vy = -520; f.ground = false; }
  return blocked;
}
/** The wire shape of a fighter (my `p`, or the bot in `bots`). */
const wire = (f) => ({ id: f.id, r: f.r, x: Math.round(f.x), y: Math.round(f.y), vx: Math.round(f.vx), vy: Math.round(f.vy), f: f.face, hp: f.hp, st: f.st, k: f.k, ai: f.ai, at: +f.at.toFixed(2), ch: f.chain });
/** The bot: closes in, blocks some attacks it sees coming (a bit late), punches, kicks, combos. */
function botControl(b, foe, now) {
  const ctl = { x: 0, jump: false, punch: false, kick: false, block: false };
  if (!foe || foe.st === "ko") return ctl;
  const dx = foe.x - b.x, d = Math.abs(dx), dir = Math.sign(dx) || 1;
  if (foe.st === "atk" && d < 130 && b.sawAi !== foe.ai) { // an attack coming: maybe block it, after a moment
    b.sawAi = foe.ai; b.blockPlan = Math.random() < CONFIG.botBlock; b.blockAt = now + CONFIG.botReact * 1000 * (0.6 + Math.random() * 0.8);
  }
  if (b.blockPlan && now >= b.blockAt && now < b.blockAt + 420) { ctl.block = true; return ctl; }
  if (now < (b.thinkUntil || 0)) { ctl.x = b.moveDir || 0; return ctl; }
  b.thinkUntil = now + 110 + Math.random() * 200;
  if (b.chain >= 2) { ctl.kick = true; return ctl; } // finish the combo
  if (d > 100) { b.moveDir = dir; ctl.jump = Math.random() < 0.04; }
  else if (d > 66) { b.moveDir = Math.random() < 0.7 ? dir : -dir * 0.5; ctl.kick = Math.random() < CONFIG.botAggro * 0.7; }
  else { b.moveDir = Math.random() < 0.2 ? -dir : 0; ctl.punch = Math.random() < CONFIG.botAggro; }
  ctl.x = b.moveDir;
  return ctl;
}

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, bots: new Map(), lastBots: 0, again: false };
/** The match as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function match() {
  const m = parseOnce("match", S.shared.match, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const roundKey = (m) => m.id + ":" + m.round;
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === me.id) && (id === me.id || S.entities.players[id]?.n));
const rid = () => "b" + Math.random().toString(36).slice(2, 6);
function adopt() {
  host.acting = true; host.last = null; host.bots.clear();
  const m = match();
  for (const b of parse(S.shared.bots, [])) host.bots.set(b.id, Object.assign(newFighter(b.id, m ? m.seats.indexOf(b.id) : 0), b, { face: b.f, stT: 0, stun: 0.3, ground: b.y >= 0 }));
}
/** A bot for seat `side` (0 = left, 1 = right), maybe carrying on from someone's fighter. */
function makeBot(m, side, from) {
  const id = rid(), b = Object.assign(newFighter(id, side), from ? { x: from.x, y: from.y, hp: from.hp, st: from.st === "ko" ? "ko" : "idle", r: from.r } : {});
  host.bots.set(id, b);
  return id;
}
function botName(m, id) { const used = new Set(Object.values(m.names || {})); return BOT_NAMES.find((n) => !used.has(n)) || "Bot"; }
/** A new match with these people on the left and right (null = a bot takes that side). */
function newMatch(id, want, challenger = false) {
  const m = { id, phase: "intro", round: 1, seats: [], names: {}, wins: {}, startAt: Date.now() + CONFIG.introMs * (challenger ? 1.6 : 1), endsAt: 0, rw: null, why: "", winner: null, ch: challenger ? 1 : 0 };
  host.bots.clear();
  for (let side = 0; side < 2; side++) {
    const pid = want[side];
    if (pid) { m.seats.push(pid); m.names[pid] = nameOf(pid); continue; }
    const bid = makeBot(m, side); m.seats.push(bid); m.names[bid] = botName(m, bid);
  }
  return writeMatch(m);
}
/** Who plays next after a match: the winner stays on, the next person waiting steps in. */
function nextPair(prev) {
  const humans = humansHere();
  if (!prev || !prev.winner || !humans.includes(prev.winner)) return humans.slice(0, 2);
  const waiting = humans.filter((h) => !prev.seats.includes(h)), loser = prev.seats.find((s) => s !== prev.winner);
  return [prev.winner, waiting[0] || (humans.includes(loser) ? loser : null)];
}
/** Seated people who are gone hand their fighter to a bot; someone new who could fight the bot
 *  instead starts a new match against the person already here ("A NEW CHALLENGER!"). */

  ctx.fillStyle = "#6b3b24"; ctx.fillRect(-2000, 0, 5000, 400);
  ctx.fillStyle = "#8a4d2e"; ctx.fillRect(-2000, 0, 5000, 14);
  ctx.strokeStyle = "#00000030"; ctx.lineWidth = 2; ctx.beginPath(); for (let x = -2000; x < 3000; x += 70) { ctx.moveTo(x, 14); ctx.lineTo(x - 30, 400); } ctx.stroke();
  for (const px of [ARENA.left - 30, ARENA.right + 30]) {
    ctx.fillStyle = "#3a1a14"; ctx.fillRect(px - 9, -230, 18, 230);
    ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.ellipse(px, -238 + Math.sin(t * 1.5 + px) * 3, 18, 24, 0, 0, Math.PI * 2); ctx.fill(); // a lantern
    ctx.fillStyle = "#ffcf7a55"; ctx.beginPath(); ctx.arc(px, -238, 46 + Math.sin(t * 3 + px) * 3, 0, Math.PI * 2); ctx.fill();
  }
  // petals drifting across
  ctx.fillStyle = "#ffc3dccc";
  for (const p of petals) { p.y += (30 + p.s * 4) * dt; p.x += (Math.sin(t + p.w) * 30 - 20) * dt; if (p.y > 40) { p.y = -500; p.x = cam.x + (Math.random() - 0.5) * 1400; } ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s, p.s * 0.5, t + p.w, 0, Math.PI * 2); ctx.fill(); }
  // fighters
  m.seats.forEach((id) => { const f = fighterOf(m, id); if (f) drawFighter(f, seatColor(m, id), t, dt, id === me.id ? "You" : null); });
  // hit stars and sparks
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i]; s.t += dt; if (s.t > 0.25) { stars.splice(i, 1); continue; }
    const r = (s.big ? 34 : 22) * (0.6 + s.t * 3), k = 1 - s.t / 0.25;
    ctx.globalAlpha = k; ctx.fillStyle = s.block ? "#8fd8ff" : "#fff3a0"; ctx.beginPath();
    for (let j = 0; j < 16; j++) { const a = j / 16 * Math.PI * 2, rr = j % 2 ? r * 0.45 : r; ctx.lineTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr); }
    ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#fff";
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; if (p.life <= 0) { sparks.splice(i, 1); continue; } ctx.globalAlpha = Math.min(1, p.life * 4); ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, comboAt = -1e9, announced = "";
const startedAt = performance.now();
function showCombo() { comboAt = performance.now(); }
function hud(m) {
  const t = Date.now(), seatName = (id) => (id === me.id ? "You" : m.names[id] && !S.entities.players[id] ? m.names[id] : nameOf(id));
  $("combo").style.opacity = performance.now() - comboAt < 900 ? 1 : 0;
  let msg = "";
  if (m.phase === "intro" && m.ch && m.startAt - t > CONFIG.introMs * 0.75) msg = `NEW CHALLENGER!<small>${esc(seatName(m.seats[0]))} vs ${esc(seatName(m.seats[1]))}</small>`;
  else if (m.phase === "intro") msg = m.startAt - t > 900 ? `ROUND ${m.round}<small>${m.round === 1 ? "Best of 5" : `${m.wins[m.seats[0]] || 0} – ${m.wins[m.seats[1]] || 0}`}</small>` : "FIGHT!";
  else if (m.phase === "fight" && t - (m.endsAt - CONFIG.roundMs) < 700) msg = "FIGHT!";
  else if (m.phase === "ko") msg = `${m.why === "KO" ? "K.O.!" : "TIME!"}<small>${m.rw === "draw" ? "A draw. Nobody takes the round." : m.rw === me.id ? "You take the round" : `${esc(seatName(m.rw))} takes the round`}</small>`;
  else if (m.phase === "over" && $("over").hidden) msg = m.winner === me.id ? "YOU WIN!" : `${esc(seatName(m.winner))} WINS!`;
  $("msg").innerHTML = msg;
  if (msg !== announced) { announced = msg; if (/K\.O\.|FIGHT/.test(msg)) sfx(/K\.O/.test(msg) ? "ko" : "bell"); }
  if (ATTRACT) { for (const id of ["sideL", "sideR", "clock", "hint", "net"]) $(id).textContent = ""; return; }
  m.seats.forEach((id, side) => {
    const f = fighterOf(m, id), hp = f && f.r === roundKey(m) ? Math.max(0, f.hp) : CONFIG.hp, w = m.wins[id] || 0;
    const el = $(side ? "sideR" : "sideL");
    el.className = `side ${side ? "r" : "l"} ${id === me.id ? "me" : ""}`;
    el.innerHTML = `<span class="nm">${esc(seatName(id))}</span><div class="hp" style="--c:${seatColor(m, id)}"><b style="width:${hp}%"></b></div><div class="pips">${"●".repeat(w)}${"○".repeat(Math.max(0, CONFIG.winRounds - w))}</div>`;
  });
  $("clock").innerHTML = m.phase === "fight" ? `${Math.max(0, Math.ceil((m.endsAt - t) / 1000))}<small>ROUND ${m.round}</small>` : `<small>ROUND ${m.round}</small>`;
  const touch = matchMedia("(pointer: coarse)").matches, seated = m.seats.includes(me.id);
  $("dpad").hidden = $("acts").hidden = !touch || !seated;
  $("hint").textContent = !seated ? "You're watching. The winner stays on: you're in next." : performance.now() - startedAt < 12000 ? (touch ? "Punch, punch, kick for a combo · hold Block to guard" : "←→ move · ↑ jump · Z punch · X kick · hold ↓ or C to block · punch, punch, kick = combo") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  const showOver = m.phase === "over" && t > m.endsAt - CONFIG.resultsMs + 1800; // "X WINS!" first, then the card
  $("over").hidden = !showOver;
  if (showOver) {
    $("overTitle").textContent = m.winner === me.id ? "You win!" : `${seatName(m.winner)} wins!`;
    $("overSub").textContent = seated ? (m.winner === me.id ? "You stay on for the next challenger." : "Shake it off. Next one's yours.") : "";
    $("results").innerHTML = [...m.seats].sort((a, b) => (m.wins[b] || 0) - (m.wins[a] || 0)).map((id) => `<li class="${id === me.id ? "me" : ""}">${esc(id === me.id ? myName : seatName(id))}<span>${m.wins[id] || 0} round${m.wins[id] === 1 ? "" : "s"}</span></li>`).join("");
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - t) / 1000))}s`;
    if (me.shownFor !== m.id) { me.shownFor = m.id; showBoard(m.winner === me.id); }
  }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { swing: [500, 900, 0.06, 0.02, "triangle"], hit: [240, 90, 0.1, 0.12, "square"], kick: [160, 50, 0.18, 0.15, "square"],
    block: [900, 600, 0.08, 0.06, "triangle"], ko: [400, 40, 0.9, 0.16, "sawtooth"], bell: [880, 870, 0.5, 0.06, "sine"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  try { audio ||= new AudioContext(); } catch {}
  if (!e.repeat) pressed.add(k);
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
for (const b of document.querySelectorAll(".pad button")) {
  const k = "pad:" + b.dataset.k;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); keys.add(k); pressed.add(k); b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { keys.delete(k); b.classList.remove("on"); });
}
cv.addEventListener("pointerdown", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.acting = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  let dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  const m0 = match();
  if (m0 && m0.phase === "ko" && Date.now() < m0.endsAt - CONFIG.koMs + 900) dt *= 0.35; // slow motion on the K.O.
  if (hitStop > 0) { hitStop -= dt; dt *= 0.1; }                                           // a tiny freeze on every hit
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const m = match();
  if (m) {
    syncViews(dt, m);
    myTick(dt, m, now);
    draw(m, now / 1000, dt);
    if (now - lastHud > 100) { lastHud = now; hud(m); }
  }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (hit, from) => {
    const m = match();
    if (!hit || !m || hit.r !== roundKey(m) || !m.seats.includes(hit.by)) return;
    const target = hit.to === me.id ? me : host.acting ? host.bots.get(hit.to) : null, a = fighterOf(m, hit.by);
    if (target && (!a || Math.abs(a.x - target.x) < 200)) { const blocked = applyHit(target, hit); hitFx(target, hit, blocked); if (target === me) { publish(true); hitStop = 0.07; } } // only from someone close by
    else sparkAt(hit.x, hit.y, hit.k);
    if (hit.k === "combo") showCombo();
  });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { introMs: 600, koMs: 1800, resultsMs: 1500, hp: 60, botAggro: 0.85, botBlock: 0.35, botReact: 0.2 });
  requestAnimationFrame(frame);
})();
</script>
